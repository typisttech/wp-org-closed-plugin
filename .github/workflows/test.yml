name: Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  php-matrix:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    outputs:
      versions: ${{ steps.php-matrix.outputs.versions }}
      highest: ${{ steps.php-matrix.outputs.highest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: composer.json
          sparse-checkout-cone-mode: false

      - id: php-matrix
        uses: typisttech/php-matrix-action@73b41f402280305866c655b5a2485d5c9d7a36bc # v4.0.0

  test:
    needs:
      - php-matrix
    permissions:
      contents: read
    strategy:
      matrix:
        suite:
          - unit
          - feature
        php-version: ${{ fromJSON(needs.php-matrix.outputs.versions) }}
        prefer:
          - highest
          - lowest
        coverage:
          - none
        include:
          - suite: unit
            php-version: ${{ needs.php-matrix.outputs.highest }}
            prefer: locked
            coverage: xdebug
          - suite: feature
            php-version: ${{ needs.php-matrix.outputs.highest }}
            prefer: locked
            coverage: xdebug
    runs-on: ubuntu-26.04
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
        - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
          with:
            php-version: ${{ matrix.php-version }}
            coverage: ${{ matrix.coverage }}

      - uses: typisttech/.github/.github/actions/composer-install@4a48cb6c63f13a3a2dca9761e0035d063cff69fc # v9.1.0
        with:
          prefer: ${{ matrix.prefer }}

      - if: matrix.coverage == 'xdebug'
        run: composer pest -- --ci --group="${SUITE}" --coverage-clover="coverage-${SUITE}.xml"
        env:
          SUITE: ${{ matrix.suite }}

      - if: matrix.coverage != 'xdebug'
        run: composer pest -- --ci --group="${SUITE}"
        env:
          SUITE: ${{ matrix.suite }}

      - if: matrix.coverage == 'xdebug'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.suite }}
          path: coverage-${{ matrix.suite }}.xml

  codecov:
    needs:
      - test
    permissions:
      id-token: write
      contents: read
    cache-mode: none
    runs-on: ubuntu-slim
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
        - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
          with:
            name: coverage-unit
        - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
          with:
            name: coverage-feature

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: coverage-unit.xml
          flags: unit

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: coverage-feature.xml
          flags: feature

  e2e:
    name: e2e (PHP ${{ matrix.php-version }}, Composer ${{ matrix.composer-version }})
    needs:
      - php-matrix
    permissions:
      contents: read
    strategy:
      matrix:
        php-version: ${{ fromJSON(needs.php-matrix.outputs.versions) }}
        composer-version:
          - '2.10'
    runs-on: ubuntu-26.04
    env:
      GOFLAGS: '-mod=mod'
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        background: true

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:${{ matrix.composer-version }}
          coverage: 'none'
        background: true

      - run: |
          sudo apt-get update && \
          sudo apt-get install --no-install-recommends --yes subversion
        background: true

      - wait: checkout

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - wait-all:

      - run: go test -count=1 -shuffle=on ./...

  wait-for-all-test:
    if: cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure')
    needs:
      - test
      - e2e
    runs-on: ubuntu-slim
    steps:
      - name: Assert no required jobs were cancelled or failed
        run: exit 1
