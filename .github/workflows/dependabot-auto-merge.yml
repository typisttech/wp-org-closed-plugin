name: Dependabot Auto-merge

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

jobs:
  dependabot:
    permissions:
      contents: read
      pull-requests: read
    cache-mode: none
    uses: typisttech/.github/.github/workflows/dependabot-auto-merge.yml@d236eb0e3d18c463896e8bc46dc0c172fca71bc5 # v9.3.4
    with:
      minor: true
      patch: true
    secrets:
      client-id: ${{ vars.TASTENDRUCK_CLIENT_ID }}
      private-key: ${{ secrets.TASTENDRUCK_PRIVATE_KEY }}
