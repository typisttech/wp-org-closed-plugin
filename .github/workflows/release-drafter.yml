name: Release Drafter

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

jobs:
  release-drafter:
    permissions:
      contents: write
      pull-requests: read
    cache-mode: none
    uses: typisttech/.github/.github/workflows/release-drafter.yml@35e5494fea692807fa0060dce74b5ed55cf5fd3a # v9.1.1
