name: Release Drafter

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

jobs:
  release-drafter:
    permissions:
      contents: write
      pull-requests: read
    cache-mode: none
    uses: typisttech/.github/.github/workflows/release-drafter.yml@4a48cb6c63f13a3a2dca9761e0035d063cff69fc # v9.1.0
