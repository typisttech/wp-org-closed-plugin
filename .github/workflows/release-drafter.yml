name: Release Drafter

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

jobs:
  release-drafter:
    permissions:
      contents: write
      pull-requests: read
    cache-mode: none
    uses: typisttech/.github/.github/workflows/release-drafter.yml@ce922ecb46e1daaf4320e7fb0a2c7fde6d0c0f65 # v9.3.7
