name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '16 3 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  php:
    uses: typisttech/.github/.github/workflows/audit-php.yml@4a48cb6c63f13a3a2dca9761e0035d063cff69fc # v9.1.0

  go:
    uses: typisttech/.github/.github/workflows/audit-go.yml@4a48cb6c63f13a3a2dca9761e0035d063cff69fc # v9.1.0
