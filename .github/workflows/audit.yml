name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '16 3 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  php:
    uses: typisttech/.github/.github/workflows/audit-php.yml@a6c5c9608df629d886e4201ffd20a2df71ed34e8

  go:
    uses: typisttech/.github/.github/workflows/audit-go.yml@a6c5c9608df629d886e4201ffd20a2df71ed34e8
