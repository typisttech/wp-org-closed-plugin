name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '16 3 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  php:
    uses: typisttech/.github/.github/workflows/audit-php.yml@fb51cbc992992caba88eeb6239511bd250c16a36 # v6.1.6

  go:
    uses: typisttech/.github/.github/workflows/audit-go.yml@7988918764384c842ba3204778ad2b51b33be9c3 # v6.1.7
