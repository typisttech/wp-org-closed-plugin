name: Lint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actions:
    uses: typisttech/.github/.github/workflows/lint-actions.yml@8b4b5df1a715953dfcd5053b6cd47b9c1095ca20 # v6.1.5

  php:
    uses: typisttech/.github/.github/workflows/lint-php.yml@8b4b5df1a715953dfcd5053b6cd47b9c1095ca20 # v6.1.5
    with:
      phpstan: true

  go:
    uses: typisttech/.github/.github/workflows/lint-go.yml@8b4b5df1a715953dfcd5053b6cd47b9c1095ca20 # v6.1.5
    with:
      golangci-lint: true
      golangci-lint-version-file: .tool-versions

  wait-for-all-lint:
    if: cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure')
    needs:
      - actions
      - php
      - go
    runs-on: ubuntu-latest
    steps:
      - name: Assert no required jobs were cancelled or failed
        run: exit 1
