name: Lint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  actions:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: typisttech/.github/.github/workflows/lint-actions.yml@0e705d95d40209ccd0f925385f14bd998ed20258 # v9.3.1

  php:
    permissions:
      contents: read
    uses: typisttech/.github/.github/workflows/lint-php.yml@0e705d95d40209ccd0f925385f14bd998ed20258 # v9.3.1
    with:
      phpstan: true

  go:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: typisttech/.github/.github/workflows/lint-go.yml@0e705d95d40209ccd0f925385f14bd998ed20258 # v9.3.1
    with:
      golangci-lint: true
      golangci-lint-version-file: .tool-versions

  wait-for-all-lint:
    if: cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure')
    needs:
      - actions
      - php
      - go
    runs-on: ubuntu-slim
    steps:
      - name: Assert no required jobs were cancelled or failed
        run: exit 1
