name: Lint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actions:
    uses: typisttech/.github/.github/workflows/lint-actions.yml@7988918764384c842ba3204778ad2b51b33be9c3 # v6.1.7

  php:
    uses: typisttech/.github/.github/workflows/lint-php.yml@7988918764384c842ba3204778ad2b51b33be9c3 # v6.1.7
    with:
      phpstan: true

  go:
    uses: typisttech/.github/.github/workflows/lint-go.yml@fb51cbc992992caba88eeb6239511bd250c16a36 # v6.1.6
    with:
      golangci-lint: true
      golangci-lint-version-file: .tool-versions

  wait-for-all-lint:
    if: cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure')
    needs:
      - actions
      - php
      - go
    runs-on: ubuntu-latest
    steps:
      - name: Assert no required jobs were cancelled or failed
        run: exit 1
